<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RUSZKOWSKI: ZDAJ ALBO POWTARZAJ</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#080e1d;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center;height:100dvh}
#game{position:relative;width:min(100vw,177.7778vh);height:min(56.25vw,100vh)}
@supports(height:100dvh){#game{width:min(100vw,177.7778dvh);height:min(56.25vw,100dvh)}}
canvas{display:block;width:100%;height:100%;touch-action:none}
#rotate{display:none;position:fixed;bottom:8px;width:100%;text-align:center;font-size:13px;pointer-events:none;color:#fcd978}
@media(orientation:portrait){#rotate{display:block}}
</style>
</head>
<body>
<div id="game"><canvas id="canvas" aria-label="Gra: zbieraj piątki i unikaj jedynek"></canvas></div>
<div id="rotate">Obróć telefon poziomo</div>
<script>
'use strict';
// CONFIG POZIOMÓW — target: cel piątek; prędkości w pikselach logicznych/s.
// exam: udział sprawdzianów wśród jedynek; interval: odstęp spawnu w sekundach.
const LEVELS = [
  {target:12, time:35, speed:168, interval:0.8925, good:0.60, diagonal:0,    exam:0,    brightness:1},
  {target:16, time:40, speed:246, interval:0.7225, good:0.50, diagonal:0.35, exam:0,    brightness:0.85},
  {target:20, time:45, speed:324, interval:0.5950, good:0.40, diagonal:0.70, exam:0.35, brightness:0.85}
];
const W=1280, H=720, FLOOR=H*0.85, PLAYER_H=H*0.22;
const BOOST_TIME=3, BOOST_EVERY=20, BOOST_FIRST=9, MAGNET=150;
const EXAM_WARNING=0.7, INVULNERABLE=0.8;
// Nowa wersja punktacji ma osobny rekord; brak dostępu do zapisu nie blokuje gry.
const RECORD_KEY='ruszkowski-hard-v1';
function readBest(){
  try{const n=Number(localStorage.getItem(RECORD_KEY));return Number.isSafeInteger(n)&&n>=0?n:0;}catch{return 0;}
}
function saveBest(){try{localStorage.setItem(RECORD_KEY,String(best));}catch{}}
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let dpr=1;
function resize(){
  const box=canvas.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(box.width*dpr));
  canvas.height=Math.max(1,Math.round(box.height*dpr));
}
window.addEventListener('resize',resize); resize();

// ASSETS — brak obrazu nigdy nie blokuje startu gry.
const assets={};
for(const name of ['damian','uczen','logo','bg']){
  const img=new Image(); assets[name]=img;
  img.src='./assets/'+name+'.png';
}
function ready(img){return img&&img.complete&&img.naturalWidth>0;}
function picture(name,x,y,w,h){
  const img=assets[name];
  if(ready(img)){ctx.drawImage(img,x,y,w,h);return;}
  ctx.fillStyle=name==='uczen'?'#8392a7':'#345079';
  ctx.fillRect(x,y,w,h); text(name,x+w/2,y+h/2,18);
}
function logo(x,y,h){
  const im=assets.logo, w=h*(ready(im)?im.naturalWidth/im.naturalHeight:0.8125);
  picture('logo',x-w/2,y,w,h);
}

// STAN GRY — checkpoint cofa punkty nieudanej próby, zapobiegając farmieniu.
let state='title',level=0,selected=0,score=0,best=readBest(),checkpoint=0;
let fives=0,ones=0,elapsed=0,spawnIn=0.8,boostIn=BOOST_EVERY,boost=0;
let items=[],sparks=[],shake=0,clock=0,paused=false,menuAge=0;
let examQueue=0,examIn=0,failure='';
let combo=0,invulnerable=0,retried=false,notice='',noticeTime=0;
function announce(message){notice=message;noticeTime=2.5;}
const player={x:W/2,dir:1,moving:false,red:0,green:0,knock:0};
function clearInput(){keys.clear();pointers.clear();player.moving=false;}
function menu(next){state=next;menuAge=0;clearInput();}
function startLevel(){
  score=checkpoint;fives=0;ones=0;elapsed=0;boost=0;
  examQueue=0;examIn=0;failure='';
  combo=0;invulnerable=0;notice='';noticeTime=0;
  spawnIn=0.8;boostIn=BOOST_FIRST;items=[];sparks=[];shake=0;
  Object.assign(player,{x:W/2,dir:1,moving:false,red:0,green:0,knock:0});
  paused=false;clearInput();state='play';
}
function newGame(){retried=false;level=0;selected=0;checkpoint=0;startLevel();}
function advance(){
  if(menuAge<0.2)return;
  if(state==='title'||state==='win')newGame();
  else if(state==='repeat'){retried=true;startLevel();}
  else if(state==='promotion'){level++;retried=false;checkpoint=score;menu('select');}
  else if(state==='select')startLevel();
}
function failLevel(reason){failure=reason;sound('sad');menu('repeat');}
function finishLevel(){
  if(ones===0)score+=500;
  sound('fanfare');
  if(level===2){best=Math.max(best,score);saveBest();menu('win');}
  else menu('promotion');
}
function togglePause(){if(state==='play'){paused=!paused;clearInput();}}

// INPUT — Pointer Events obsługują także kilka palców naraz.
const keys=new Set(),pointers=new Map();
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function inside(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
const muteBox={x:1190,y:14,w:72,h:54},pauseBox={x:1105,y:14,w:72,h:54};
const cards=[{x:310,y:250,w:300,h:310},{x:670,y:250,w:300,h:310}];
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','a','d','enter','p','r','m',' '].includes(k))e.preventDefault();
  unlockAudio();
  if(e.repeat)return;
  keys.add(k);
  if(k==='m')muted=!muted;
  if(k==='p')togglePause();
  if(k==='r'&&state==='play'){retried=true;startLevel();}
  if(state==='select'&&['arrowleft','a','arrowright','d'].includes(k))selected=['arrowleft','a'].includes(k)?0:1;
  if(k==='enter'){if(paused)togglePause();else advance();}
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();unlockAudio();const p=point(e);
  if(inside(p,muteBox)){muted=!muted;return;}
  if(state==='play'){
    if(inside(p,pauseBox)||paused){togglePause();return;}
    pointers.set(e.pointerId,p.x<W/2?-1:1);
    try{canvas.setPointerCapture(e.pointerId);}catch{}
  }else if(state==='select'){
    const i=cards.findIndex(r=>inside(p,r));
    if(i>=0){selected=i;advance();}else advance();
  }else advance();
});
canvas.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,point(e).x<W/2?-1:1);
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])
  canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{clearInput();if(state==='play')paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(state==='play')paused=true;}});

// AUDIO — synteza bez plików; odblokowanie dopiero po geście użytkownika.
let audio=null,muted=false;
function unlockAudio(){
  try{
    if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio)audio=new Audio();}
    if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});
  }catch{}
}
function tone(freq,delay,duration,type='sine',end=freq){
  if(!audio||muted||audio.state!=='running')return;
  try{
    const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(end,t+duration);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.10,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+0.02);
  }catch{}
}
function sound(kind){
  if(kind==='ding'){tone(880,0,0.15);tone(1320,0.08,0.22);}
  if(kind==='buzz')tone(150,0,0.25,'sawtooth',65);
  if(kind==='clang'){tone(1600,0,0.16,'triangle',600);tone(2230,0,0.10);}
  if(kind==='fanfare')[523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.25,'triangle'));
  if(kind==='sad')[392,370,330,196].forEach((f,i)=>tone(f,i*0.18,0.30,'sawtooth',f*0.9));
  if(kind==='powerup')[440,660,880,1320].forEach((f,i)=>tone(f,i*0.08,0.2));
}

// SPAWNER — w klasie 3 sprawdziany zastępują część jedynek.
function spawn(kind,fromSeries=false){
  const cfg=LEVELS[level];
  if(!kind)kind=Math.random()<cfg.good?'5':(Math.random()<cfg.exam?'exam':'1');
  // Seria trzech sprawdzianów: pierwszy teraz, dwa kolejne co 0,55 s.
  if(kind==='exam'&&!fromSeries&&examQueue===0){examQueue=2;examIn=0.55;}
  const diagonal=kind!=='logo'&&Math.random()<cfg.diagonal;
  items.push({kind,x:100+Math.random()*(W-200),y:-90,
    vx:diagonal?(Math.random()<0.5?-1:1)*cfg.speed*0.45:0,
    vy:kind==='logo'?145:cfg.speed,phase:Math.random()*Math.PI*2,reflected:false,warning:kind==='exam'?EXAM_WARNING:0});
}
function size(o){return o.kind==='exam'?{w:200,h:84}:o.kind==='logo'?{w:58,h:70}:{w:54,h:70};}
function burst(x,y,color){
  for(let i=0;i<12;i++)sparks.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*190,life:.5,color});
}

// PLAYER — fizyka niezależna od liczby klatek; hitbox to 60% sprite'a.
function playerWidth(){
  const img=assets[selected?'damian':'uczen'];
  return PLAYER_H*(ready(img)?img.naturalWidth/img.naturalHeight:0.65);
}
function updatePlayer(dt){
  const left=keys.has('arrowleft')||keys.has('a')||[...pointers.values()].includes(-1);
  const right=keys.has('arrowright')||keys.has('d')||[...pointers.values()].includes(1);
  const dir=Number(right)-Number(left);
  player.moving=dir!==0;if(dir)player.dir=dir;
  player.x+=dir*470*dt+player.knock*dt;player.knock*=Math.exp(-12*dt);
  const half=playerWidth()/2;player.x=Math.max(half,Math.min(W-half,player.x));
  player.red=Math.max(0,player.red-dt);player.green=Math.max(0,player.green-dt);
}

// COLLISIONS — każdy obiekt jest rozliczany tylko raz.
function collides(o){
  const s=size(o),half=playerWidth()*.30;
  return o.x+s.w/2>player.x-half&&o.x-s.w/2<player.x+half&&
    o.y+s.h/2>FLOOR-PLAYER_H&&o.y-s.h/2<FLOOR;
}
function collect(o){
  if(o.kind==='logo'){boost=BOOST_TIME;sound('powerup');burst(player.x,FLOOR-80,'#ffda62');return;}
  if(o.kind==='5'){
    fives++;combo++;score+=100+Math.min(combo-1,5)*20;player.green=.15;sound('ding');burst(o.x,o.y,'#2ecc40');
    if(fives>=LEVELS[level].target)finishLevel();
  }else{
    if(invulnerable>0)return;
    ones++;combo=0;invulnerable=INVULNERABLE;player.red=.3;shake=.22;
    if(ones===2)announce('Zagrożenie! Jeszcze jedna jedynka i poprawka.');
    player.knock=(player.x>=o.x?1:-1)*450;sound('buzz');burst(o.x,o.y,'#e5322d');
    if(ones===3)failLevel('Trzy jedynki — czas na poprawkę.');
  }
}
function update(dt){
  invulnerable=Math.max(0,invulnerable-dt);noticeTime=Math.max(0,noticeTime-dt);
  updatePlayer(dt);boost=Math.max(0,boost-dt);shake=Math.max(0,shake-dt);
  const old=Math.floor(elapsed);elapsed+=dt;score+=Math.floor(elapsed)-old;
  if(elapsed>=LEVELS[level].time){failLevel('Koniec czasu! Nie udało się zebrać wymaganych piątek.');return;}
  if(examQueue>0){examIn-=dt;if(examIn<=0){spawn('exam',true);examQueue--;examIn+=0.55;}}
  spawnIn-=dt;boostIn-=dt;
  if(spawnIn<=0){spawn();spawnIn+=LEVELS[level].interval;}
  if(boostIn<=0){spawn('logo');boostIn+=BOOST_EVERY;}
  for(let i=items.length-1;i>=0;i--){
    const o=items[i];
    // Sprawdzian czeka nieruchomo na końcu ostrzeżenia; nie ma jeszcze kolizji.
    if(o.warning>0){o.warning=Math.max(0,o.warning-dt);continue;}
    if(boost>0&&o.kind==='5'&&!o.reflected){
      const dx=player.x-o.x,dy=FLOOR-PLAYER_H/2-o.y,dist=Math.hypot(dx,dy);
      if(dist<MAGNET){const speed=650;o.vx=dx/Math.max(dist,1)*speed;o.vy=dy/Math.max(dist,1)*speed;}
    }
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    const half=size(o).w/2;
    if(o.x<half){o.x=half;o.vx=Math.abs(o.vx);}
    if(o.x>W-half){o.x=W-half;o.vx=-Math.abs(o.vx);}
    if(!o.reflected&&collides(o)){
      if(boost>0&&(o.kind==='1'||o.kind==='exam')){
        o.reflected=true;o.vy=-420;o.vx=(o.x<player.x?-1:1)*260;sound('clang');
        burst(o.x,o.y,'#ffda62');
      }else{items.splice(i,1);collect(o);if(state!=='play')return;}
    }else if(o.kind==='5'&&o.y-size(o).h/2>FLOOR){
      // Piątka minęła stopy — odejmujemy postęp tylko raz, bez wartości ujemnych.
      fives=Math.max(0,fives-1);items.splice(i,1);
      announce('Uciekła piątka! −1 do postępu klasy.');
    }else if(o.y>H+120||(o.reflected&&o.y<-120))items.splice(i,1);
  }
  for(const p of sparks){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}
  sparks=sparks.filter(p=>p.life>0);
}

// RENDER — wszystkie pozycje mają stały układ 1280×720.
function text(value,x,y,size=26,color='#fff',align='center'){
  ctx.fillStyle=color;ctx.font=`700 ${size}px Arial,sans-serif`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(value,x,y);
}
function panel(x,y,w,h,color='rgba(9,19,39,.94)'){
  ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
}
function background(){
  const img=assets.bg;ctx.save();ctx.filter=`brightness(${LEVELS[level].brightness})`;
  if(ready(img)){
    const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);
    ctx.drawImage(img,(W-img.naturalWidth*s)/2,(H-img.naturalHeight*s)/2,img.naturalWidth*s,img.naturalHeight*s);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#639dd0');g.addColorStop(1,'#dbe9ee');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#818998';ctx.fillRect(0,FLOOR,W,H-FLOOR);
  }
  ctx.restore();if(level===2){ctx.fillStyle='rgba(25,63,133,.27)';ctx.fillRect(0,0,W,H);}
}
function drawPlayer(){
  const w=playerWidth(),bounce=player.moving?Math.sin(clock*19)*4:0;
  ctx.save();ctx.translate(player.x,FLOOR+bounce);
  ctx.rotate(player.moving?player.dir*8*Math.PI/180:0);
  ctx.scale(player.dir,1);
  if(invulnerable>0)ctx.globalAlpha=Math.sin(clock*35)>0?0.4:1;
  if(player.green>0)ctx.scale(1.15,1.15);
  if(boost>0||player.red>0||player.green>0){
    ctx.shadowColor=player.red>0?'#ff2020':player.green>0?'#2ecc40':'#ffd65a';ctx.shadowBlur=24;
  }
  if(player.red>0)ctx.filter='sepia(1) saturate(8) hue-rotate(315deg)';
  if(player.green>0)ctx.filter='sepia(1) saturate(4) hue-rotate(65deg)';
  picture(selected?'damian':'uczen',-w/2,-PLAYER_H,w,PLAYER_H);ctx.restore();
}
function drawItem(o){
  if(o.warning>0){
    ctx.save();ctx.globalAlpha=0.75+0.25*Math.sin(clock*20);
    const x=Math.max(105,Math.min(W-105,o.x));
    panel(x-95,100,190,60,'#8e251f');text('! SPRAWDZIAN',x,130,21,'#fff');
    ctx.restore();return;
  }
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(clock*2+o.phase)*Math.PI/12);
  if(o.kind==='logo'){
    ctx.shadowColor='#ffd65a';ctx.shadowBlur=18+8*Math.sin(clock*5);logo(0,-35,70);
  }else if(o.kind==='exam'){
    panel(-100,-42,200,84,'#fff');text('SPRAWDZIAN',0,-14,21,'#182437');text('NIEZAL.',0,17,25,'#e5322d');
  }else{
    ctx.font='900 64px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
    ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(o.kind,0,0);
    ctx.fillStyle=o.kind==='5'?'#2ecc40':'#e5322d';ctx.fillText(o.kind,0,0);
  }ctx.restore();
}
function drawHUD(){
  panel(0,0,W,92,'rgba(8,17,34,.91)');
  text('KLASA '+(level+1),24,30,26,'#ffda62','left');
  text('Piątki '+fives+' / '+LEVELS[level].target,220,30,25,'#60e473','left');
  text('Jedynki '+('●'.repeat(ones)+'○'.repeat(3-ones)),470,30,25,'#ff7975','left');
  text('Punkty: '+score,760,30,26,'#fff','left');
  text(boost>0?'TARCZA + MAGNES':'BOOSTER',24,70,16,'#ffda62','left');
  ctx.fillStyle='#344054';ctx.fillRect(220,61,500,14);
  ctx.fillStyle='#ffda62';ctx.fillRect(220,61,500*boost/BOOST_TIME,14);
  text(boost>0?boost.toFixed(1)+' s':'Złap logo szkoły',745,69,17,'#c8d5e8','left');
  text('Seria: '+combo+' · następna 5: +'+(100+Math.min(combo,5)*20),920,70,15,'#7ced8b','left');
  panel(pauseBox.x,pauseBox.y,pauseBox.w,pauseBox.h);text('Ⅱ',1141,41,27);
}
function button(label,y=600){panel(390,y-28,500,56,'#d7b14d');text(label,W/2,y,24,'#101b30');}

// UI — menu pozostaje czytelne także wtedy, gdy brakuje wszystkich grafik.
function drawUI(){
  if(state==='play'){
    drawHUD();
    panel(14,654,320,50);
    text('TRUDNA · Czas: '+Math.max(0,Math.ceil(LEVELS[level].time-elapsed))+' s',174,679,23,LEVELS[level].time-elapsed<=10?'#ff7975':'#ffda62');
    if(noticeTime>0){panel(300,175,680,48);text(notice,640,199,21,'#ffda62');}
    if(paused){panel(290,240,700,230);text('PAUZA',640,300,48,'#ffda62');text('P / Enter / dotknij, aby wrócić',640,370,25);}
  }else{
    ctx.fillStyle='rgba(4,12,28,.78)';ctx.fillRect(0,0,W,H);
    if(state==='title'){
      logo(640,36,104);text('RUSZKOWSKI: ZDAJ ALBO POWTARZAJ',640,185,42,'#ffda62');
      text('Dzień Programisty 2026 · ZSZ im. Jana Ruszkowskiego w Pułtusku',640,238,23);
      panel(250,292,780,204);
      text('Zbieraj zielone 5 — cele klas: 12 / 16 / 20 piątek.',640,338,25,'#7ced8b');
      text('Unikaj czerwonych 1 — trzy jedynki to powtórka.',640,393,25,'#ff9690');
      text('Logo = 3 s tarczy · przepuszczona piątka: −1.',640,448,25,'#ffda62');
      text('WERSJA TRUDNA · Limity czasu: 35 / 40 / 45 s',640,525,24,'#ffda62');
      text('Piątki w serii: +100 do +200 pkt · jedynka zeruje serię',640,558,18,'#c3d0e2');
      button('Naciśnij Enter / dotknij ekranu');
      text('← → lub A/D: ruch · P: pauza · R: restart · M: dźwięk',640,664,20,'#c3d0e2');
    }else if(state==='select'){
      text(level===1?'Odblokowano: nauczyciel dołącza do gry!':'Wybierz postać przed Klasą 3',640,132,38,'#ffda62');
      text('Klasa '+(level+1)+' · ← → i Enter lub dotknij karty',640,195,25);
      cards.forEach((r,i)=>{
        panel(r.x,r.y,r.w,r.h,i===selected?'#34466c':'#14233d');
        ctx.strokeStyle=i===selected?'#ffda62':'#697995';ctx.lineWidth=4;ctx.strokeRect(r.x,r.y,r.w,r.h);
        picture(i?'damian':'uczen',r.x+45,r.y+15,210,210);
        text(i?'Damian':'Uczeń',r.x+150,r.y+266,30,i===selected?'#ffda62':'#fff');
      });button('Enter — zaczynamy',620);
    }else if(state==='win'){
      panel(220,95,840,540,'rgba(248,242,220,.97)');logo(640,115,75);
      text('ZDAŁEŚ!',640,242,55,'#162743');
      text('Świadectwo z wyróżnieniem',640,306,35,'#162743');
      text('ZSZ im. Jana Ruszkowskiego w Pułtusku',640,360,24,'#44506a');
      if(retried)text('Poprawka zaliczona!',640,395,22,'#317844');
      text('Wynik: '+score,640,435,34,'#162743');
      text('Rekord: '+best,640,488,25,'#44506a');button('Od nowa',570);
    }else{
      panel(200,215,880,320);
      text(state==='repeat'?'Powtarzasz klasę!':'Zdałeś! Promocja do klasy '+(level+2),640,280,42,state==='repeat'?'#ff8d85':'#81eb91');
      if(state==='promotion'&&retried)text('Poprawka zaliczona!',640,318,21,'#ffda62');
      text('Wynik: '+score,640,350,31);
      text(state==='repeat'?failure:ones===0?'Bez jedynki! Premia +500 punktów.':'Kolejna klasa czeka.',640,412,23,'#cbd7e7');
      button('Enter / dotknij — dalej',490);
    }
  }
  panel(muteBox.x,muteBox.y,muteBox.w,muteBox.h);
  text(muted?'M ×':'M ♪',1226,41,22,muted?'#ff9690':'#ffda62');
}
function render(){
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0&&state==='play'&&!paused)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12);
  background();
  if(state==='play'){
    items.forEach(drawItem);drawPlayer();
    for(const p of sparks){ctx.globalAlpha=p.life/.5;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5);}ctx.globalAlpha=1;
  }
  ctx.restore();drawUI();
}
let last=0;
function frame(now){
  const dt=last?Math.min((now-last)/1000,.05):0;last=now;menuAge+=dt;
  if(!paused){clock+=dt;if(state==='play')update(dt);}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
